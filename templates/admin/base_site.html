{% extends "admin/base.html" %}
{% load i18n static %}

{% block extrahead %}
{{ block.super }}
<!-- Web App Manifest & iOS PWA Native Configuration -->
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Surron Admin">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
<link rel="apple-touch-icon" sizes="192x192" href="{% static 'images/icon-192x192.png' %}">
<link rel="apple-touch-icon" sizes="512x512" href="{% static 'images/icon-512x512.png' %}">

<script>
  window.VAPID_PUBLIC_KEY = "{{ VAPID_PUBLIC_KEY|default:'' }}";
</script>
{% endblock %}
