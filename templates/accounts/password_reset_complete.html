{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset Complete | Surron{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="max-w-700 mx-auto bg-white p-4 p-md-5 rounded-4 border-0 shadow-lg" style="max-width: 500px;" data-aos="fade-up">
        <div class="mb-4">
            <a class="d-inline-flex align-items-center justify-content-center mb-3" href="{% url 'pages:home' %}">
                <img src="{% static 'images/surron-logo.jpg' %}" alt="Surron Bikes &amp; Parts" class="rounded-3 shadow-sm" style="height: 60px; width: auto; object-fit: contain;">
            </a>
            <div class="rounded-circle bg-success-subtle text-success mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                <i class="fas fa-check-circle fs-3"></i>
            </div>
            <h3 class="fw-extrabold text-dark mb-2">Password Updated!</h3>
            <p class="text-secondary small mb-0">
                Your new password has been set successfully. You can now use your updated credentials to access your account.
            </p>
        </div>
        <a href="{% url 'accounts:login' %}" class="btn btn-volt btn-lg w-100 fw-bold rounded-pill shadow-sm">
            <i class="fas fa-sign-in-alt me-2"></i> Sign In to Account
        </a>
    </div>
</div>
{% endblock %}
