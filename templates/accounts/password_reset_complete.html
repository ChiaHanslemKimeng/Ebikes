{% extends 'base.html' %}
{% block title %}Password Reset Complete | Surron{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="max-w-700 mx-auto bg-white p-5 rounded-4 border shadow-sm" style="max-width: 500px;">
        <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
        <h3 class="fw-extrabold text-dark mb-2">Password Successfully Changed</h3>
        <p class="text-secondary small mb-4">
            Your new password has been set. You can now use it to sign in to your Surron account.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-volt btn-lg w-100 fw-bold">Sign In Now</a>
    </div>
</div>
{% endblock %}
