{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | Surron{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="max-w-700 mx-auto" style="max-width: 480px;">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <div class="width-60 height-60 rounded-circle bg-light text-primary mx-auto d-flex align-items-center justify-content-center fs-3 mb-2" style="width: 60px; height: 60px;">
                    <i class="fas fa-key"></i>
                </div>
                <h3 class="fw-extrabold text-dark">Reset Password</h3>
                <p class="text-secondary small">Enter your account email to receive a password reset link.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required autofocus>
                </div>
                <button type="submit" class="btn btn-volt btn-lg w-100 fw-bold py-3 mt-2">
                    Send Reset Link
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-secondary">
                Remember your password? <a href="{% url 'accounts:login' %}" class="fw-bold text-primary">Sign In</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
